global
maxconn 100

defaults
mode tcp
timeout connect 5s
timeout client 30s
timeout server 30s

frontend psql
bind *:5432
default_backend postgres_nodes

backend postgres_nodes
option httpchk GET /master
http-check expect status 200
default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions

server pg-master pg-master:5432 check port 8008
server pg-slave pg-slave:5432 check port 8008